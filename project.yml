# XcodeGen spec. Regenerate the project with `xcodegen generate` after editing.
# The .xcodeproj is committed for convenience, but this file is the source of truth.
name: Cadence

options:
  bundleIdPrefix: com.sidharthdutta
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

packages:
  CadenceKit:
    path: .

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Cadence:
    type: application
    platform: iOS
    sources:
      - path: App/Cadence
    dependencies:
      - package: CadenceKit
        product: CadenceUI
    info:
      path: App/Cadence/Info.plist
      properties:
        CFBundleDisplayName: Cadence
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        # Lets the dev build talk to a cadence-api running on localhost over plain HTTP.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 7Z62JKF2LJ

schemes:
  Cadence:
    build:
      targets:
        Cadence: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: CadenceKit/CadenceCoreTests
